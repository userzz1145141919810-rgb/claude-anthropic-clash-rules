# Claude / Anthropic Full Rules for Clash (Mihomo)
# =================================================
# Core rules + third-party dependencies that Claude's web/desktop
# client actually loads (fonts, CDN, telemetry, support widgets).
#
# WARNING: Some entries are SHARED services (e.g. storage.googleapis.com,
# sentry.io, intercom.io). Routing them here will also route unrelated
# traffic of those services through the same policy. Use the basic
# anthropic.yaml if you only want first-party Anthropic traffic.
#
# Sources:
#   - VPSDance/ai-proxy-rules (rules/clash/anthropic.yaml)
#   - tanitany/claude-quantumultx-rules (Anthropic-Full.list)
#   - MetaCubeX/meta-rules-dat, v2fly/domain-list-community
#   - BGP.he.net (Anthropic, PBC)

